<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <img id="imagem" src="https://picsum.photos/id/29/600/400" alt="">
    
    <script>


        const imagens = [
            "https://picsum.photos/id/237/600/400",
            "https://picsum.photos/id/238/600/400",
            "https://picsum.photos/id/239/600/400",
            "https://picsum.photos/id/240/600/400"
        ];

        let indice = 0;

        function trocarImagem () {

            indice++;

            if (indice > 3) {

                indice = 0;

            }

            document.getElementById("imagem").src = imagens[indice];

        }

        setInterval(trocarImagem, 5000);

    </script>

</body>
</html>
