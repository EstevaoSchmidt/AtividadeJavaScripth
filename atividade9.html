<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

     <style>
        
        body {

            background-color: white;
            color: black;
        }

        .escuro {
            background-color: black;
            color: white;
        }

        .escuro input {
            background-color: #777474;
            color: white;
        }

        .escuro button {

            background-color: #777474;
            color: white;
        }

    </style>

</head>
<body>

    <input type="text" id="sabor" placeholder="Digite um sabor...">

    <p id="resposta"></p>

    <button id="modo">escuro</button>

    <script>

        const sabor = document.getElementById("sabor");
        const resposta = document.getElementById("resposta");
        const modo = document.getElementById("modo");

        sabor.addEventListener("input", () => {
            
            const texto = sabor.value;

            if (texto.length > 3) {

                if (texto.includes("chocolate")) {
                    resposta.textContent =
                        "Eu amo sorvete de chocolate!";

                } else if (texto.includes("flocos")) {
                    resposta.textContent =
                        "Ahh, mas chocolate é o meu favorito...";

                } else {
                    resposta.textContent =
                        "Ahh, eu esperava um sabor de sorvete...";
                }

            }
        });

        modo.addEventListener("click", () => {

            //adicina ou remove a classe escuro em body
            document.body.classList.toggle("escuro");

            if (document.body.classList.contains("escuro")) {
                modo.textContent = "claro";
            } else {
                modo.textContent = "escuro";
            }

        });
        
    </script>

</body>
</html>
